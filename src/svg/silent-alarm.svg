<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="d_sa_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#05070a"/><stop offset="1" stop-color="#12202b"/></linearGradient>
    <linearGradient id="d_sa_van" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06110b"/><stop offset="1" stop-color="#0c1a14"/></linearGradient>
    <radialGradient id="d_sa_green" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="rgba(124,255,178,0.28)"/><stop offset="1" stop-color="transparent"/></radialGradient>
    <radialGradient id="d_sa_gold" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="rgba(232,200,90,0.4)"/><stop offset="1" stop-color="transparent"/></radialGradient>
  </defs>
  <rect width="400" height="160" fill="url(#d_sa_bg)"/>

  <!-- LEFT: the van + green console (The Eye) -->
  <rect x="0" y="0" width="200" height="160" fill="url(#d_sa_van)"/>
  <ellipse cx="80" cy="80" rx="120" ry="90" fill="url(#d_sa_green)"/>
  <g>
    <rect x="18" y="30" width="70" height="52" rx="4" fill="#04120c" stroke="#1c3a2c" stroke-width="2"/>
    <rect x="100" y="30" width="70" height="52" rx="4" fill="#04120c" stroke="#1c3a2c" stroke-width="2"/>
    <g stroke="#2fbf71" stroke-width="1" opacity="0.7">
      <line x1="24" y1="44" x2="82" y2="44"/><line x1="24" y1="56" x2="76" y2="56"/><line x1="24" y1="68" x2="82" y2="68"/>
      <line x1="106" y1="44" x2="164" y2="44"/><line x1="106" y1="56" x2="150" y2="56"/><line x1="106" y1="68" x2="164" y2="68"/>
    </g>
    <text x="52" y="112" text-anchor="middle" font-size="13" fill="#7cffb2" font-family="Consolas, monospace" letter-spacing="2">7 2 9</text>
  </g>

  <!-- RIGHT: the museum vault + the Nightingale (The Hand) -->
  <rect x="200" y="0" width="200" height="160" fill="#0b1118"/>
  <ellipse cx="320" cy="80" rx="120" ry="90" fill="url(#d_sa_gold)"/>
  <g>
    <circle cx="320" cy="74" r="46" fill="#141c26" stroke="#2b3d48" stroke-width="6"/>
    <circle cx="320" cy="74" r="52" fill="none" stroke="#57d6e6" stroke-width="1.5" opacity="0.5"/>
    <!-- the jewelled nightingale -->
    <g transform="translate(320 74)">
      <ellipse cx="0" cy="6" rx="16" ry="11" fill="#e8c85a"/>
      <circle cx="-4" cy="-8" r="8" fill="#e8c85a"/>
      <path d="M4 -9 l14 -5 l-11 9 z" fill="#c9a227"/>
      <circle cx="-6" cy="-9" r="1.6" fill="#141c26"/>
    </g>
    <text x="320" y="140" text-anchor="middle" font-size="13" fill="#e8c85a" font-family="Consolas, monospace" letter-spacing="2">4 1 6</text>
  </g>

  <!-- red security laser crossing the museum side -->
  <line x1="210" y1="40" x2="398" y2="120" stroke="#ff3b57" stroke-width="1.6" opacity="0.75"/>
  <line x1="210" y1="120" x2="398" y2="46" stroke="#ff3b57" stroke-width="1.2" opacity="0.55"/>

  <!-- the seam between the two worlds -->
  <line x1="200" y1="0" x2="200" y2="160" stroke="#57d6e6" stroke-width="1" opacity="0.45" stroke-dasharray="3 5"/>

  <!-- Gus the rat on the seam -->
  <g class="bob">
    <path d="M188 150 q-14 4 -16 -6 q-1 -9 9 -9 q7 0 8 6" fill="none" stroke="#c98a94" stroke-width="2.6" stroke-linecap="round" opacity="0.9"/>
    <path d="M192 150 q-10 -14 4 -22 q18 -8 26 6 q6 10 -6 16 q-14 6 -24 0 z" fill="#2b333d" stroke="#0e1319" stroke-width="1.4"/>
    <circle cx="200" cy="130" r="7" fill="#2b333d" stroke="#0e1319" stroke-width="1.2"/>
    <circle cx="200" cy="130" r="3.5" fill="#b57f88" opacity="0.7"/>
    <circle cx="216" cy="140" r="2.2" fill="#dffbef"/><circle cx="216.7" cy="139.3" r="0.9" fill="#7cffb2"/>
    <circle cx="224" cy="146" r="1.6" fill="#e0949e"/>
  </g>

  <!-- drifting motes -->
  <circle class="drift" cx="60" cy="30" r="2.2" fill="#7cffb2" opacity="0.6"/>
  <circle class="drift" cx="150" cy="46" r="1.8" fill="#eafff2" opacity="0.5" style="animation-delay:-2.5s"/>
  <circle class="drift" cx="300" cy="34" r="2" fill="#e8c85a" opacity="0.5" style="animation-delay:-1.4s"/>
  <circle class="drift" cx="360" cy="52" r="1.7" fill="#ff8f8f" opacity="0.45" style="animation-delay:-3.2s"/>
</svg>
