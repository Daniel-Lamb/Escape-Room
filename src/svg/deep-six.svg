<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="d_ds_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#06131b"/><stop offset="1" stop-color="#02080c"/></linearGradient>
    <linearGradient id="d_ds_water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a2230"/><stop offset="1" stop-color="#040c12"/></linearGradient>
    <radialGradient id="d_ds_lamp" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="rgba(255,224,150,0.42)"/><stop offset="1" stop-color="transparent"/></radialGradient>
    <radialGradient id="d_ds_sonar" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="rgba(124,240,190,0.30)"/><stop offset="1" stop-color="transparent"/></radialGradient>
  </defs>
  <rect width="400" height="160" fill="url(#d_ds_bg)"/>

  <!-- LEFT: the flooded wreck (The Diver) -->
  <rect x="0" y="0" width="200" height="160" fill="url(#d_ds_water)"/>
  <ellipse cx="120" cy="60" rx="120" ry="90" fill="url(#d_ds_lamp)"/>
  <!-- descent line dropping to a hatch valve -->
  <line x1="120" y1="0" x2="120" y2="96" stroke="#3a4a52" stroke-width="2" stroke-dasharray="2 6" opacity="0.75"/>
  <g>
    <rect x="70" y="96" width="100" height="52" rx="6" fill="#0a1a22" stroke="#2b3547" stroke-width="3"/>
    <circle cx="120" cy="122" r="20" fill="#0d1f28" stroke="#c9a227" stroke-width="3"/>
    <g stroke="#c9a227" stroke-width="2.4" stroke-linecap="round">
      <line x1="120" y1="106" x2="120" y2="138"/><line x1="104" y1="122" x2="136" y2="122"/>
      <line x1="109" y1="111" x2="131" y2="133"/><line x1="131" y1="111" x2="109" y2="133"/>
    </g>
  </g>
  <!-- brass depth-mark -->
  <g>
    <rect x="20" y="40" width="34" height="46" rx="4" fill="#33301f" stroke="#c9a227" stroke-width="1.6"/>
    <text x="37" y="64" text-anchor="middle" font-size="13" fill="#e8c85a" font-family="Consolas, monospace" font-weight="bold">20</text>
    <text x="37" y="80" text-anchor="middle" font-size="14" fill="#dfe9ec" font-family="Georgia, serif">D</text>
  </g>

  <!-- RIGHT: the boat cabin (The Tender) -->
  <rect x="200" y="0" width="200" height="160" fill="#08151d"/>
  <ellipse cx="290" cy="82" rx="120" ry="90" fill="url(#d_ds_sonar)"/>
  <!-- sonar scope -->
  <g>
    <circle cx="288" cy="80" r="46" fill="#031712" stroke="#123a2c" stroke-width="4"/>
    <g stroke="#1c5a44" stroke-width="1" opacity="0.6" fill="none">
      <circle cx="288" cy="80" r="16"/><circle cx="288" cy="80" r="32"/>
      <line x1="242" y1="80" x2="334" y2="80"/><line x1="288" y1="34" x2="288" y2="126"/>
    </g>
    <line x1="288" y1="80" x2="288" y2="36" stroke="#7cf0be" stroke-width="1.5" opacity="0.6" transform="rotate(40 288 80)"/>
    <circle cx="306" cy="64" r="3" fill="#7cf0be" class="drift"/>
  </g>
  <!-- porthole with the dive line -->
  <g>
    <circle cx="366" cy="42" r="24" fill="#03121a" stroke="#20323f" stroke-width="4"/>
    <line x1="366" y1="20" x2="366" y2="64" stroke="#3a4a52" stroke-width="1.6" stroke-dasharray="1 5" opacity="0.8"/>
  </g>

  <!-- the seam between deck and deep -->
  <line x1="200" y1="0" x2="200" y2="160" stroke="#7cf0be" stroke-width="1" opacity="0.4" stroke-dasharray="3 5"/>

  <!-- Gus the harbor seal on the seam -->
  <g class="bob">
    <ellipse cx="200" cy="118" rx="18" ry="15" fill="#5f6d7d" stroke="#2b3644" stroke-width="1.4"/>
    <ellipse cx="200" cy="106" rx="13" ry="12" fill="#6f7d8c" stroke="#2b3644" stroke-width="1.2"/>
    <ellipse cx="200" cy="112" rx="7" ry="5" fill="#9aa7b4"/>
    <circle cx="195" cy="104" r="3.2" fill="#141b22"/><circle cx="205" cy="104" r="3.2" fill="#141b22"/>
    <circle cx="196" cy="103" r="1" fill="#dff2f2"/><circle cx="206" cy="103" r="1" fill="#dff2f2"/>
    <g stroke="#c7d2da" stroke-width="0.7" opacity="0.7"><line x1="194" y1="112" x2="182" y2="110"/><line x1="206" y1="112" x2="218" y2="110"/></g>
  </g>

  <!-- rising bubbles -->
  <circle class="drift" cx="60" cy="120" r="2.4" fill="#bfe9ff" opacity="0.6"/>
  <circle class="drift" cx="150" cy="70" r="1.8" fill="#eafcff" opacity="0.5" style="animation-delay:-2.5s"/>
  <circle class="drift" cx="96" cy="40" r="2" fill="#bfe9ff" opacity="0.5" style="animation-delay:-1.4s"/>
  <circle class="drift" cx="340" cy="120" r="1.7" fill="#7cf0be" opacity="0.45" style="animation-delay:-3.2s"/>
</svg>
