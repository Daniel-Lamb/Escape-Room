<svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="d_lg_bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c0a14"/><stop offset="1" stop-color="#1c1830"/></linearGradient>
    <linearGradient id="d_lg_glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(232,235,242,0.18)"/><stop offset="0.5" stop-color="rgba(159,168,189,0.06)"/><stop offset="1" stop-color="transparent"/></linearGradient>
    <radialGradient id="d_lg_warm" cx="0.5" cy="0.5" r="0.6"><stop offset="0" stop-color="rgba(255,207,138,0.4)"/><stop offset="1" stop-color="transparent"/></radialGradient>
  </defs>
  <rect width="400" height="160" fill="url(#d_lg_bg)"/>
  <!-- warm side glow (left) vs cold silver (right) -->
  <ellipse cx="90" cy="90" rx="120" ry="90" fill="url(#d_lg_warm)"/>
  <!-- the great mirror, centre -->
  <g>
    <rect x="150" y="24" width="100" height="120" rx="6" fill="none" stroke="#9fa8bd" stroke-width="5"/>
    <rect x="156" y="30" width="88" height="108" fill="url(#d_lg_glass)"/>
    <line x1="200" y1="24" x2="200" y2="144" stroke="#c9ccd6" stroke-width="1" opacity="0.5" stroke-dasharray="3 5"/>
  </g>
  <!-- a candle (real, left) and its reversed silver reflection (right) -->
  <g>
    <rect x="120" y="86" width="8" height="26" rx="2" fill="#e8dcc0"/>
    <path class="flame" d="M124 70 q7 10 2 20 q-2 4 -2 4 q0 0 -2 -4 q-5 -10 2 -20z" fill="#ffcf8a"/>
  </g>
  <g opacity="0.7">
    <rect x="272" y="86" width="8" height="26" rx="2" fill="#9fa8bd"/>
    <path d="M276 70 q-7 10 -2 20 q2 4 2 4 q0 0 2 -4 q5 -10 -2 -20z" fill="#c9ccd6"/>
  </g>
  <!-- the cat on the seam -->
  <g class="bob">
    <ellipse cx="200" cy="140" rx="16" ry="10" fill="#181524"/>
    <path d="M190 138 q0 -18 10 -20 q10 2 10 20 z" fill="#181524"/>
    <path d="M192 122 l-3 -8 7 4 z" fill="#181524"/><path d="M208 122 l3 -8 -7 4 z" fill="#181524"/>
    <circle cx="196" cy="130" r="2" fill="#b7e04a"/><circle cx="204" cy="130" r="2" fill="#b7e04a"/>
  </g>
  <!-- drifting silver motes -->
  <circle class="drift" cx="70" cy="40" r="2.5" fill="#e8ebf2" opacity="0.7"/>
  <circle class="drift" cx="330" cy="54" r="2" fill="#e8ebf2" opacity="0.6" style="animation-delay:-3s"/>
  <circle class="drift" cx="300" cy="30" r="2.2" fill="#e8ebf2" opacity="0.5" style="animation-delay:-1.5s"/>
</svg>
