<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Puzzle Modal Gallery</title>
  <!-- main.css, animations.css and the game's skin.css are added by modals.js,
       after it points <base> at the game folder (so a puzzle's art/… resolves). -->
  <style>
    :root { color-scheme: dark; }
    html { overflow: auto !important; height: auto !important; }
    body { position: static !important; background: #0b0d14; color: #d8dcea; font: 14px/1.4 system-ui, sans-serif; margin: 0; padding: 16px; overflow: auto; height: auto; }
    header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 14px; }
    header select, header label { font: inherit; }
    #report { white-space: pre-wrap; background: #151826; border: 1px solid #262a3d; border-radius: 8px; padding: 10px 12px; margin-bottom: 14px; font: 12px/1.5 ui-monospace, monospace; }
    #report.bad { border-color: #7a2a3a; }
    /* each modal at its real desktop width (620px, or 900px wide), so sizes measure as a player sees them */
    .gallery { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
    .cell { position: relative; }
    .cell > .tag { font: 11px/1.3 ui-monospace, monospace; color: #8a90a8; margin-bottom: 4px; }
    .cell.fail > .tag { color: #ff8080; }
    .cell .modal-card { position: relative !important; left: auto !important; top: auto !important; transform: none !important;
      opacity: 1 !important; max-height: 620px; transition: none !important; }
    .cell.fail .modal-card { outline: 2px dashed #ff4d4d; outline-offset: 3px; }
    table { border-collapse: collapse; font: 12px/1.5 ui-monospace, monospace; }
    td, th { padding: 3px 10px; border-bottom: 1px solid #262a3d; text-align: left; }
    td.bad { color: #ff8080; }
    /* laid out (so sizes can be measured) but off-screen */
    iframe { position: absolute; left: -12000px; top: 0; width: 1400px; height: 900px; border: 0; }
    .blocked { padding: 40px; text-align: center; }
  </style>
</head>
<body>
  <script type="module" src="./modals.js"></script>
</body>
</html>
